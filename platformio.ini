; WireClaw - ESP32 AI Agent
;
; Build:   pio run                    (builds default target: esp32-c6)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; FS:      pio run -t uploadfs
;
; Other targets: pio run -e esp32-s3, pio run -e esp32, pio run -e esp32-c3

[platformio]
default_envs = esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = colorize, time

[env:esp32-c6]
board = esp32-c6-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:esp32-s3]
board = esp32-s3-devkitc-1

; Heltec WiFi LoRa 32 V4 — S3 target with the board's SSD1306 + white LED.
; Pins from the official Heltec V4 pinmap:
;   OLED SDA=17 SCL=18 RST=21 · Vext_Ctrl=36 (active LOW) · white LED=35
;   VBAT_Read=1 (ADC1_CH0) · ADC_Ctrl=37 (active HIGH) · 390k/100k -> x4.9
;   SX1262: SCK9 MISO11 MOSI10 NSS8 RST12 BUSY13 DIO1=14 · DIO2=RF-switch
;   TCXO on DIO3 @1.8V. LoRa leg is RX-ONLY (lora_ears); defaults tuned to a
;   Meshtastic LongFast/US mesh (906.875 MHz BW250 SF11 CR4/5 sync 0x2B).
; Flash layout stays the stock 4MB partitions.csv so an app-only reflash
; (write-flash 0x10000 firmware.bin) preserves config/littlefs.
[env:esp32-s3-heltec-v4]
board = esp32-s3-devkitc-1
build_flags =
    -DWIRECLAW_OLED
    -DWIRECLAW_OLED_SDA=17
    -DWIRECLAW_OLED_SCL=18
    -DWIRECLAW_OLED_RST=21
    -DWIRECLAW_OLED_VEXT=36
    -DWIRECLAW_STATUS_LED=35
    -DWIRECLAW_VBAT_ADC=1
    -DWIRECLAW_VBAT_CTRL=37
    -DWIRECLAW_VBAT_SCALE=4.9f
    -DWIRECLAW_LORA_SX1262=1
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    jgromes/RadioLib@^7.0.0

; Classic ESP32 not supported: DRAM overflow (~60KB over dram0_0_seg limit)
; due to large static buffers (LLM request, history, TLS). Use ESP32-C3 instead.
;[env:esp32]
;board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1
